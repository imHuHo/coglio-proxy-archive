# Costruisce l'APK Android nel cloud di GitHub, senza installare Android Studio.
# Uso: carica questo progetto in un repository GitHub, poi scheda Actions -> "Android APK" -> Run workflow.
# L'APK (debug, installabile) compare in fondo alla pagina dell'esecuzione, sotto "Artifacts".
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Copia l'app web in capacitor/www
        run: python3 tools/build.py
      - name: Installa Capacitor e crea il progetto Android
        working-directory: capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Icone dell'app
        working-directory: capacitor
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#3347d6' --iconBackgroundColorDark '#3347d6'
      - name: Compila l'APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: coglio-proxy-archive-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
