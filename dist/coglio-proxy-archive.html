<title>Coglio Proxy Archive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap">
<style>
/* Coglio Proxy Archive
 * Layout: barra laterale su PC, barra a schede in basso su telefono; al centro la vista.
 * Colori: inchiostro blu + accento indaco; verde/ambra/rosso solo per lo stato delle copie. */
:root {
  --bg: #eceef5;
  --surface: #ffffff;
  --surface2: #f5f6fb;
  --fg: #14172b;
  --muted: #586079;
  --line: #d8dbe8;
  --accent: #3347d6;
  --accent-fg: #ffffff;
  --accent-soft: #e3e6fb;
  --stamp: #e4572e;
  --free: #0f7a55;   --free-bg: #daf2e8;
  --busy: #bd2a40;   --busy-bg: #fbe2e6;
  --part: #8f5b00;   --part-bg: #faedcf;
  --display: "Syne", "Segoe UI", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --gx: max(16px, env(safe-area-inset-left, 0px));
  --gx2: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1020; --surface: #171a2e; --surface2: #1e2238; --fg: #eceefb; --muted: #9ba1bd; --line: #2b3050;
    --accent: #93a1ff; --accent-fg: #0e1020; --accent-soft: #252b57;
    --free: #62dcab; --free-bg: #123a2c; --busy: #ff8fa1; --busy-bg: #3e1822; --part: #f3c55e; --part-bg: #3a2e10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1020; --surface: #171a2e; --surface2: #1e2238; --fg: #eceefb; --muted: #9ba1bd; --line: #2b3050;
  --accent: #93a1ff; --accent-fg: #0e1020; --accent-soft: #252b57;
  --free: #62dcab; --free-bg: #123a2c; --busy: #ff8fa1; --busy-bg: #3e1822; --part: #f3c55e; --part-bg: #3a2e10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--body);
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Struttura ---------- */
.shell { display: block; min-height: 100vh; }
.side { display: none; }
.main { padding: 8px var(--gx2) 112px var(--gx); max-width: 880px; margin: 0 auto; width: 100%; min-width: 0; }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px var(--gx2) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gx);
}
.nav {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 0; background: none; padding: 6px 2px; border-radius: 10px;
  color: var(--muted); font-size: 10.5px; font-weight: 600; min-width: 0;
}
.nav svg { width: 22px; height: 22px; }
.nav[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

@media (min-width: 860px) {
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); }
  .side {
    display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; align-self: start;
    background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px 22px var(--gx);
  }
  .side .nav { flex-direction: row; gap: 12px; padding: 10px 12px; font-size: 14px; justify-content: flex-start; }
  .side .nav svg { width: 20px; height: 20px; }
  .tabs { display: none; }
  .main { padding-bottom: 64px; padding-top: 18px; }
}

.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; text-decoration: none; color: var(--fg); }
.brand svg { flex: none; }
.brand b { display: block; font: 800 20px/1 var(--display); letter-spacing: -0.01em; }
.brand small { display: block; font: 500 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.mobile-brand { display: flex; align-items: center; gap: 10px; padding: 14px 0 4px; }
.mobile-brand b { font: 800 19px/1 var(--display); }
.mobile-brand small { font: 500 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 2px; }
@media (min-width: 860px) { .mobile-brand { display: none; } }

/* ---------- Intestazioni ---------- */
.vh { padding: 14px 0 10px; display: flex; flex-direction: column; gap: 4px; }
.vh h1 { font: 800 28px/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.sub b { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.back { align-self: flex-start; border: 0; background: none; color: var(--accent); padding: 4px 0; font-weight: 600; }

/* ---------- Controlli ---------- */
.sticky {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding: 8px 0 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px;
}
.search { position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.input, .select, .textarea {
  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); font-size: 16px;
}
.search .input { padding-left: 42px; font-weight: 600; }
.input::placeholder, .textarea::placeholder { color: var(--muted); font-weight: 400; }
.textarea { font: 13px/1.5 var(--mono); min-height: 220px; resize: vertical; }
.select { padding-right: 10px; }
.row-sel { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; align-items: end; }
.lbl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; min-width: 0; }
.lbl .select, .lbl .input { text-transform: none; letter-spacing: 0; color: var(--fg); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px;
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip i { font: 500 11.5px var(--mono); font-style: normal; color: var(--muted); margin-left: 6px; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip[aria-pressed="true"] i { color: inherit; opacity: .7; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--busy); border-color: var(--busy); }
.btn.danger.armed { background: var(--busy); color: var(--surface); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .tr { width: 46px; height: 26px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch .tr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .15s; }
.switch input:checked + .tr { background: var(--free); }
.switch input:checked + .tr::after { transform: translateX(20px); }
.switch input:focus-visible + .tr { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Liste ---------- */
.count { margin: 12px 0 8px; color: var(--muted); font-size: 13px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); border-left-width: 5px; overflow: hidden; }
.item.s-free { border-left-color: var(--free); }
.item.s-part { border-left-color: var(--part); }
.item.s-busy { border-left-color: var(--busy); }
.item-main {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  width: 100%; border: 0; background: none; text-align: left; padding: 11px 14px;
}
.nm { font-weight: 700; font-size: 15.5px; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.tag { font: 500 11px var(--mono); background: var(--surface2); border: 1px solid var(--line); color: var(--muted); padding: 1px 6px; border-radius: 5px; }
.tag.cmd { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.cnt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cnt b { font: 800 20px var(--display); }
.cnt small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.s-free .cnt b { color: var(--free); } .s-part .cnt b { color: var(--part); } .s-busy .cnt b { color: var(--busy); }
.meter { grid-column: 1 / -1; display: flex; gap: 3px; height: 7px; margin-top: 4px; }
.meter i { flex: 1; border-radius: 3px; background: var(--free); min-width: 0; }
.meter i.u { background: var(--busy); }
.meter.bar i { border-radius: 0; }
.detail { border-top: 1px dashed var(--line); background: var(--surface2); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.detail h3 { font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.where { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.where li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.pill { font: 700 11px var(--body); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.use { background: var(--busy-bg); color: var(--busy); }
.pill.free { background: var(--free-bg); color: var(--free); }
.pill.part { background: var(--part-bg); color: var(--part); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.qty { font: 600 13px var(--mono); }
.more { margin: 14px 0 0; }

/* Mazzi */
.deckcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.deckcard .top { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
.deckcard h2 { font: 700 18px/1.2 var(--display); overflow-wrap: anywhere; }
.deckcard .meta { color: var(--muted); font-size: 13px; }
.deckcard .foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.deckcard.is-on { border-color: var(--free); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; margin-bottom: 14px; }
.subtabs { display: flex; gap: 6px; margin: 4px 0 12px; }
.subtabs .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.crow { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 9px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.crow .qty { min-width: 2.2em; color: var(--muted); }
.crow .nm { font-size: 15px; }
.crow .other { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 5px; padding-left: 2.9em; }

/* Upgrade */
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.sum b { display: block; font: 800 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.sum span { font-size: 12px; color: var(--muted); font-weight: 600; }
.sum .g b { color: var(--free); } .sum .r b { color: var(--busy); }
.cols { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .cols { grid-template-columns: 1fr 1fr; align-items: start; } }
.col h2 { font: 700 15px var(--display); margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
.col h2 .qty { color: var(--muted); }
.col.out h2 { color: var(--busy); } .col.in h2 { color: var(--free); }
.up-row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.up-row .nm { font-size: 14.5px; flex: 1 1 140px; }
.up-row .sm { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }

/* Import */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.err { color: var(--busy); font-weight: 600; margin: 0; }
.warn { background: var(--part-bg); color: var(--part); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.pick { max-height: 340px; overflow: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.opt .nm { font-size: 15px; flex: 1; }

/* Varie */
.how { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.how summary { cursor: pointer; font-weight: 700; }
.how p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.how b { color: var(--fg); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 18px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font: 800 22px var(--display); }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }
.steps { text-align: left; color: var(--muted); font-size: 14px; max-width: 46ch; margin: 0; padding-left: 20px; }
.steps b { color: var(--fg); }
.sect { margin: 22px 0 8px; font: 700 13px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.out-ta { min-height: 120px; }

#toast {
  position: fixed; z-index: 50; left: 50%; translate: -50% 0; width: min(520px, calc(100% - 32px));
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); border-radius: 12px; padding: 12px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px; font-weight: 600; font-size: 14px;
  box-shadow: 0 8px 28px #0005;
}
#toast button { border: 0; background: none; color: var(--accent); font-weight: 800; padding: 4px 6px; }
#toast .tbtns { display: flex; align-items: center; gap: 2px; flex: none; }
#toast button.tx { font-size: 20px; line-height: 1; padding: 2px 8px; text-decoration: none; opacity: .75; }
#toast button.tx:hover { opacity: 1; }
:root:not([data-theme="light"]) #toast button { color: var(--accent-fg); text-decoration: underline; }
@media (min-width: 860px) { #toast { bottom: 24px; } }
@media (max-width: 480px) {
  .vh h1 { font-size: 25px; }
  .sum b { font-size: 20px; }
  .item-main { padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Upgrade: riepilogo degli spostamenti e avviso carte già stampate */
.sm { color: var(--muted); font-size: 12.5px; }
.plan { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.plan h3 { font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.plan ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.reuse { background: var(--part-bg); border: 1px solid var(--part); border-radius: 10px; padding: 12px 14px; color: var(--fg); }
.reuse p { margin: 0 0 8px; }
.reuse b { color: var(--part); font: 800 15px var(--display); letter-spacing: .02em; }
.reuse ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; max-height: 260px; overflow: auto; }
.reuse li .qty { color: var(--part); font-weight: 700; margin-right: 4px; }
.reuse.alt { background: var(--surface2); border-color: var(--line); }
.reuse.alt summary { cursor: pointer; font-weight: 700; }
.reuse.alt ul { margin-top: 8px; }

/* Anteprime delle carte */
.ttl { display: flex; align-items: center; gap: 11px; min-width: 0; }
.ttx { display: block; min-width: 0; }
.th {
  flex: none; width: 36px; height: 50px; border-radius: 4px; overflow: hidden; position: relative;
  background: var(--surface2); border: 1px solid var(--line); align-self: center;
}
.th:not(.on):not(.nf) { background: linear-gradient(100deg, var(--surface2) 30%, var(--line) 50%, var(--surface2) 70%) 0 0 / 220% 100%; animation: thsk 1.4s linear infinite; }
.th.nf { opacity: .45; border-style: dashed; }
.th img { display: block; width: 100%; height: 100%; object-fit: cover; }
.th.on { cursor: zoom-in; }
@keyframes thsk { to { background-position: -220% 0; } }
@media (prefers-reduced-motion: reduce) { .th:not(.on):not(.nf) { animation: none; } }
.crow:has(.th), .up-row:has(.th) { align-items: center; }
.crow:has(.th) .other { padding-left: calc(46px + 2.9em); }
.up-row .th { width: 30px; height: 42px; }
.lb {
  position: fixed; inset: 0; z-index: 60; background: rgba(8, 10, 22, .78); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lb-box { display: grid; gap: 10px; justify-items: center; width: min(360px, 100%); }
.lb-box img { width: 100%; max-height: calc(100vh - 120px); object-fit: contain; border-radius: 4.5% / 3.2%; box-shadow: 0 18px 50px #000a; background: var(--surface2); aspect-ratio: 488 / 680; }
.lb-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; width: 100%; }
.lb-name { flex: 1 1 100%; text-align: center; color: #fff; font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
#hv { position: fixed; z-index: 55; width: 252px; pointer-events: none; }
#hv img { display: block; width: 100%; border-radius: 4.5% / 3.2%; box-shadow: 0 14px 40px #000a; background: var(--surface2); aspect-ratio: 488 / 680; }

.where li .th { width: 30px; height: 42px; }
.lb-box.wide { width: min(960px, 100%); }
.lb-box.wide .lb-name { flex-basis: 100%; }
.pr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; width: 100%; max-height: min(78vh, 820px); overflow: auto; padding: 2px; }
.pr { border: 2px solid transparent; background: none; padding: 3px; border-radius: 8px; display: grid; gap: 4px; color: #fff; text-align: center; }
.pr img { width: 100%; border-radius: 6px; background: var(--surface2); aspect-ratio: 488 / 680; object-fit: cover; }
.pr span { font: 600 12.5px var(--mono); }
.pr .pn { font: 500 11.5px var(--ui, inherit); opacity: .8; overflow-wrap: anywhere; }
.pr:hover, .pr:focus-visible { border-color: #fff8; }
.pr.cur { border-color: var(--accent); background: #ffffff1a; }
.lb-wait { grid-column: 1 / -1; color: #fff; text-align: center; margin: 12px 0; }

.th.fb { border-color: var(--part); }

    if (ot.length) {
      h += '<div class="reuse alt"><p><b>Stessa carta, stampa diversa.</b> Hai già queste carte ma in un\'altra stampa. Se ti basta puoi riusarle (nel mazzo resta la stampa che hai davvero); se vuoi proprio quella della lista vanno stampate (per l\'archivio sono carte diverse).</p><ul>' + ot.map(function (x) {
        return '<li>' + ck(x, 'other', 'Usa questa stampa') + '<span class="qty">' + x.other + '×</span> ' + esc(x.name) + (x.wanted.length === 1 ? '<span class="sm"> nella lista: ' + esc(prLabel(x.wanted[0])) + '</span>' : '') + '<span class="sm"> hai: ' + where(x.otherRows) + '</span></li>';
      }).join('') + '</ul></div>';
    }
    return h + (h ? '<p class="hint" id="reuse-sum" role="status">' + reuseSumText() + '</p>' : '');
  }
  function reuseSumText() {
    var d = ui.draft; if (!d || !d.parsed) return '';
    var n = 0, pk = d.reuse || {};
    C.findReusable(d.parsed.cards, state.decks, state.settings).forEach(function (x) { n += (pk[x.key + '|exact'] ? x.exact : 0) + (pk[x.key + '|other'] ? x.other : 0); });
    return n ? 'Prenderò ' + plural(n, 'copia', 'copie') + ' da quelle che hai già: non le devi stampare.' : 'Nessuna carta presa: le stamperai tutte.';
  }
  function reuseSummary() { var el = $('#reuse-sum'); if (el) el.textContent = reuseSumText(); }
  function importStep2(d) {
    var p = d.parsed;
    return '<header class="vh"><button class="back" data-a="draft-back">← Lista</button><h1>Scegli il commander</h1><p class="sub"><b>' + p.total + '</b> carte (' + p.unique + ' diverse)' + (p.excluded ? ' · ' + p.excluded + ' escluse (sideboard)' : '') + '</p></header>' +
      '<section class="panel">' +
      (p.total !== 100 ? '<p class="warn">La lista ha ' + p.total + ' carte: un mazzo Commander di solito ne ha 100. Puoi importarla lo stesso.</p>' : '') +
      (p.warnings.length ? '<p class="warn">' + plural(p.warnings.length, 'riga non letta', 'righe non lette') + ': ' + esc(p.warnings.slice(0, 3).join(' | ')) + (p.warnings.length > 3 ? '…' : '') + '</p>' : '') +
      reuseBanner(p.cards) +
      '<div class="search">' + IC.search + '<input class="input" data-c="cmd-q" type="search" placeholder="Cerca il commander nella lista" autocomplete="off" aria-label="Cerca il commander" value="' + esc(d.cq) + '"></div>' +
      '<div class="pick" id="cmdlist" role="radiogroup" aria-label="Commander">' + cmdListHtml(d) + '</div>' +
      '<label class="lbl">Stato del mazzo' + statusSelect({ kind: 'deck', status: d.status, active: d.status === 'active' }, 'draft-status') + '</label>' +
      '<p class="hint" style="margin-top:-4px">' + esc(statusHint({ kind: 'deck', status: d.status, active: d.status === 'active' })) + '</p>' +
      '<div class="btns"><button class="btn primary" data-a="draft-create">Crea mazzo</button></div></section>';
  }
  function draftNext() {
    var d = ui.draft, p = C.parseList(d.text);
    if (!p.cards.length) { d.error = 'Non ho trovato nessuna carta. Incolla una lista con righe tipo «1 Sol Ring».'; render(); return; }
    d.error = ''; d.parsed = p;
    if (d.mode === 'deck') { d.commander = p.hints[0] || null; d.step = 2; d.cq = ''; window.scrollTo(0, 0); render(); }
    else draftCreate();
  }
  function draftCreate() {
    var d = ui.draft, p = d.parsed, now = Date.now();
    if (d.mode === 'upgrade') {
      var deck = getDeck(d.deckId); if (!deck) return;
      var up = { id: C.uid('u'), name: d.name.trim() || 'Upgrade ' + (deck.upgrades.length + 1), cards: p.cards, commander: null, createdAt: now };
      deck.upgrades.push(up); deck.updatedAt = now; touch(deck.id);
      ui.view = 'upgrade'; ui.deckId = deck.id; ui.upId = up.id; ui.upQ = ''; ui.upSt = 'all'; ui.draft = null;
      toast('Upgrade creato: ' + plural(sum(p.cards), 'carta', 'carte')); window.scrollTo(0, 0); render(); return;
    }
    var kind = d.mode === 'binder' ? 'binder' : 'deck';
    var nd = {
      id: C.uid('d'), name: d.name.trim() || (kind === 'binder' ? 'Carte sciolte' : d.commander || 'Nuovo mazzo'), kind: kind,
      status: kind === 'deck' ? d.status : 'inactive', active: kind === 'deck' && d.status === 'active', commander: kind === 'deck' ? (d.commander || null) : null,
      cards: C.clone(p.cards), upgrades: [], createdAt: now, updatedAt: now
    };
    var taken = kind === 'deck' ? C.applyReuse(state.decks, nd, d.reuse, state.settings) : [];
    taken.forEach(function (x) { touch(x.deckId); });
    state.decks.push(nd); touch(nd.id);
    if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { /* ignorato */ } }
    ui.view = kind === 'deck' ? 'deck' : 'archive'; ui.deckId = nd.id; ui.deckTab = 'cards'; ui.deckQ = ''; ui.draft = null;
    var nTaken = taken.reduce(function (t, x) { return t + x.qty; }, 0);
    toast((kind === 'deck' ? 'Mazzo creato' : 'Carte aggiunte') + ': ' + plural(sum(p.cards), 'carta', 'carte') +
      (nTaken ? ' · ' + plural(nTaken, 'copia presa', 'copie prese') + ' da carte sciolte e mazzi non attivi, non da stampare' : ''), null, !!nTaken); window.scrollTo(0, 0); render();
  }

  /* ---------- Dati ---------- */
  function exportJson() { return JSON.stringify({ app: 'coglio-proxy-archive', version: 1, exportedAt: new Date().toISOString(), decks: state.decks, settings: state.settings }, null, 1); }
  function storageLabel() {
    return { claude: 'Salvati nel tuo spazio privato di Claude, sincronizzati sui tuoi dispositivi.', idb: 'Salvati su questo dispositivo (archivio del browser). Fai backup ogni tanto.', local: 'Salvati su questo dispositivo (archivio del browser). Fai backup ogni tanto.', memory: 'Salvataggio non disponibile: i dati si perdono alla chiusura. Esporta un backup.' }[store ? store.kind : 'memory'];
  }
  function imagesHint() {
    if (store && store.kind === 'claude') return 'Dentro la pagina di Claude le immagini esterne sono bloccate. Appaiono nell\'app per Windows, nell\'APK e nella versione web installata.';
    if (state.settings.images === false) return 'Immagini spente: nelle liste vedi solo i nomi.';
    return 'Le miniature arrivano da Scryfall, servono internet la prima volta e restano ricordate sul dispositivo' + (IMG.count() ? ' (' + plural(IMG.count(), 'carta', 'carte') + (IMG.count() === 1 ? ' già salvata)' : ' già salvate)') + '.' : '.') + ' Tocca una miniatura per ingrandirla.';
  }
  function dataView() {
    var armedReset = armed('reset');
    return '<header class="vh"><h1>Dati</h1><p class="sub">' + esc(storageLabel()) + '</p></header>' +
      NEWS.panel() +
      '<section class="panel"><h2 class="sect" style="margin:0">Impostazioni</h2>' +
      '<label class="lbl">Tema<select class="select" data-c="theme"><option value="auto"' + (state.settings.theme === 'auto' ? ' selected' : '') + '>Automatico</option><option value="light"' + (state.settings.theme === 'light' ? ' selected' : '') + '>Chiaro</option><option value="dark"' + (state.settings.theme === 'dark' ? ' selected' : '') + '>Scuro</option></select></label>' +
      '<label class="switch"><input type="checkbox" data-c="basics"' + (state.settings.basicsUnlimited ? ' checked' : '') + '><span class="tr"></span><span>Terre base sempre disponibili negli upgrade</span></label>' +
      '<label class="switch"><input type="checkbox" data-c="images"' + (state.settings.images !== false ? ' checked' : '') + '><span class="tr"></span><span>Mostra le immagini delle carte</span></label>' +
      '<p class="hint">' + imagesHint() + '</p>' +
      (IMG.enabled() && IMG.count() ? '<div class="btns"><button class="btn small" data-a="img-clear">Cancella le immagini salvate</button></div>' : '') + '</section>' +
      '<section class="panel"><h2 class="sect" style="margin:0">Backup</h2><p class="hint">Un file JSON con tutti i mazzi, gli upgrade e le impostazioni.</p>' +
      '<div class="btns"><button class="btn" data-a="dl-json">Scarica backup</button><button class="btn" data-a="copy-json">Copia backup</button></div>' +
      (ui.backupOut ? '<textarea class="textarea out-ta mono" readonly aria-label="Backup">' + esc(ui.backupOut) + '</textarea>' : '') +
      '<label class="lbl">Ripristina da backup<textarea class="textarea out-ta mono" data-c="restore-text" placeholder="Incolla qui il JSON del backup">' + esc(ui.restoreText) + '</textarea></label>' +
      '<label class="lbl">Oppure scegli il file<input class="input" type="file" data-c="restore-file" accept=".json,application/json"></label>' +
      (ui.dataMsg ? '<p class="' + (ui.dataMsg.indexOf('Errore') === 0 ? 'err' : 'hint') + '" role="status">' + esc(ui.dataMsg) + '</p>' : '') +
      '<div class="btns"><button class="btn" data-a="restore-json">Ripristina (sostituisce tutto)</button></div></section>' +
      UPD.panel() +
      '<section class="panel"><h2 class="sect" style="margin:0">Zona rischiosa</h2><div class="btns"><button class="btn danger' + (armedReset ? ' armed' : '') + '" data-a="reset-all" data-cf="1">' + (armedReset ? 'Conferma: cancella tutto' : 'Cancella tutti i dati') + '</button></div></section>' +
      '<p class="hint" style="margin-top:18px">Coglio Proxy Archive · le carte vengono riconosciute per nome: collezione e numero servono solo a ritrovare la stampa. Immagini e dati delle carte: Scryfall. Le carte Magic sono © Wizards of the Coast.</p>';
  }
  function readFile(file, cb) {
    var r = new FileReader(); r.onload = function () { cb(String(r.result || '')); };
    r.onerror = function () { toast('Non riesco a leggere il file.'); }; r.readAsText(file);
  }

  /* ---------- Eventi ---------- */
  document.addEventListener('click', function (e) {
    var th = e.target.closest('.th.on');
    if (th) { IMG.open(th); return; }
    var el = e.target.closest('[data-a]'); if (!el) return;
    var a = el.dataset.a, id = el.dataset.id;
    if (!el.dataset.cf) ui.confirm = null;
    if (a.indexOf('bd-') === 0 && window.CPABuilder) { window.CPABuilder.click(a, el); return; }
    if (a.indexOf('dz-') === 0 && window.CPADesigner) { if (el.dataset.cf) ui.confirm = null; window.CPADesigner.click(a, el); return; }
    var deck;
    switch (a) {
      case 'nav': go(el.dataset.v); break;
      case 'undo': if (TOAST._undo) { var uf = TOAST._undo; hideToast(); uf(); } break;
      case 'toast-close': hideToast(); break;
      case 'st': ui.st = el.dataset.v; ui.limit = 150; render(); break;
      case 'more': ui.limit += 150; updateArchiveList(); break;
      case 'toggle-card': ui.open[el.dataset.k] = !ui.open[el.dataset.k]; updateArchiveList(); break;
      case 'open-deck': ui.view = 'deck'; ui.deckId = id; ui.deckTab = 'cards'; ui.deckQ = ''; window.scrollTo(0, 0); render(); break;
      case 'deck-tab': ui.deckTab = el.dataset.v; render(); break;
      case 'back-deck': ui.view = 'deck'; ui.deckTab = 'ups'; window.scrollTo(0, 0); render(); break;
      case 'del-deck':
        confirmThen('del-deck:' + id, function () {
          var d = getDeck(id); mutate('Mazzo eliminato: ' + (d ? d.name : ''), function () { state.decks = state.decks.filter(function (x) { return x.id !== id; }); });
          ui.view = 'decks'; render();
        }); break;
      case 'make-pdf': if (window.CPABuilder) window.CPABuilder.open(id); break;
      case 'copy-deck': deck = getDeck(); if (deck) copyText(C.exportText(deck)).then(function (ok) { toast(ok ? 'Lista copiata negli appunti.' : 'Copia non riuscita.'); }); break;
      case 'new-up': ui.draft = newDraft('upgrade', ui.deckId); ui.view = 'import'; window.scrollTo(0, 0); render(); break;
      case 'up-st': ui.upSt = el.dataset.v; render(); break;
      case 'open-up': ui.upId = id; ui.upQ = ''; ui.upSt = 'all'; ui.view = 'upgrade'; window.scrollTo(0, 0); render(); break;
      case 'apply-up':
        confirmThen('apply-up:' + id, function () {
          var rep;
          mutate(function () {
            var n = rep ? rep.toLoose.reduce(function (t, x) { return t + x.qty; }, 0) : 0;
            return 'Upgrade applicato: ' + plural(n, 'carta tolta è finita', 'carte tolte sono finite') + ' nelle sciolte.';
          }, function () { rep = C.applyUpgradeMoves(state.decks, ui.deckId, id, state.settings); });
          ui.view = 'deck'; ui.deckTab = 'cards'; window.scrollTo(0, 0); render();
        }); break;
      case 'del-up':
        confirmThen('del-up:' + id, function () {
          mutate('Upgrade eliminato.', function () { var d = getDeck(); d.upgrades = d.upgrades.filter(function (x) { return x.id !== id; }); });
          ui.view = 'deck'; ui.deckTab = 'ups'; render();
        }); break;
      case 'copy-up':
        deck = getDeck();
        var up = deck && deck.upgrades.filter(function (x) { return x.id === id; })[0];
        if (up) copyText(C.diffText(deck, up, C.diffUpgrade(deck, up, state.decks, state.settings))).then(function (ok) { toast(ok ? 'Lista dei cambi copiata.' : 'Copia non riuscita.'); });
        break;
      case 'draft-mode': ui.draft.mode = el.dataset.v; render(); break;
      case 'draft-next': draftNext(); break;
      case 'reuse-all':
        C.findReusable(ui.draft.parsed.cards, state.decks, state.settings).forEach(function (x) { if (x.exact > 0) ui.draft.reuse[x.key + '|exact'] = true; });
        render(); break;
      case 'reuse-none': ui.draft.reuse = {}; render(); break;
      case 'draft-back': ui.draft.step = 1; render(); break;
      case 'draft-create': draftCreate(); break;
      case 'dl-json':
        ui.backupOut = '';
        download('coglio-proxy-archive-backup.json', exportJson(), 'application/json').then(function (r) {
          if (r === 'declined') return;
          toast(r ? 'Backup pronto.' : 'Download non disponibile qui: usa «Copia backup».');
        }); break;
      case 'copy-json':
        copyText(exportJson()).then(function (ok) {
          if (ok) toast('Backup copiato negli appunti.'); else { ui.backupOut = exportJson(); toast('Copia automatica non riuscita: seleziona il testo qui sotto.'); render(); }
        }); break;
      case 'restore-json': restore(ui.restoreText); break;
      case 'bracket':
        deck = getDeck(id);
        if (deck) { if (BK.available()) BK.start(deck); else BK.web(deck); }
        break;
      case 'bk-web':
        deck = getDeck(id) || getDeck();
        if (deck) BK.web(deck);
        break;
      case 'bk-set': BK.set(parseInt(el.dataset.n, 10)); break;
      case 'bk-close': BK.close(); break;
      case 'bk-keep': break;
      case 'lb-close': IMG.close(); break;
      case 'lb-flip': IMG.flip(); break;
      case 'lb-prints': IMG.prints(); break;
      case 'lb-back': IMG.back(); break;
      case 'lb-pick': IMG.pick(el.dataset.s, el.dataset.n); break;
      case 'lb-keep': break;
      case 'news-open': NEWS.open(); break;
      case 'news-close': NEWS.close(); break;
      case 'upd-check': UPD.check(); break;
      case 'upd-go': UPD.start(); break;
      case 'upd-reload': UPD.reload(); break;
      case 'upd-quit': if (window.cpaNet && window.cpaNet.quit) window.cpaNet.quit(); else toast('Chiudi la finestra per uscire.'); break;
      case 'img-clear': IMG.clear(); toast('Immagini salvate cancellate: le riscarico quando servono.'); render(); break;
      case 'reset-all':
        confirmThen('reset', function () { mutate('Tutti i dati cancellati.', function () { state.decks = []; }); render(); }); break;
    }
  });

  function restore(text) {
    var o;
    try { o = JSON.parse(text); } catch (err) { ui.dataMsg = 'Errore: il testo non è un JSON valido.'; render(); return; }
    var decks = o && (Array.isArray(o.decks) ? o.decks : o.state && o.state.decks);
    if (!Array.isArray(decks)) { ui.dataMsg = 'Errore: non sembra un backup di Coglio Proxy Archive.'; render(); return; }
    mutate('Backup ripristinato: ' + plural(decks.length, 'mazzo', 'mazzi') + '.', function () {
      state.decks = decks.map(C.sanitizeDeck); state.settings = C.sanitizeSettings(o.settings || (o.state && o.state.settings)); applyTheme();
    });
    ui.dataMsg = ''; ui.restoreText = ''; render();
  }

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { if (window.CPADesigner && ui.view === 'designer' && window.CPADesigner.escape()) return; if (window.CPABuilder && ui.view === 'builder' && window.CPABuilder.escape()) return; if (BK.isOpen()) BK.close(); else if (IMG.isOpen()) IMG.close(); } });
  document.addEventListener('mousemove', function (ev) {
    var t = ev.target.closest && ev.target.closest('.th.on');
    IMG.hover(!!t, t, ev);
  });
  window.addEventListener('scroll', function () { IMG.hover(false); }, true);

  document.addEventListener('input', function (e) {
    var c = e.target.dataset && e.target.dataset.c; if (!c) return;
    if (c.indexOf('bd-') === 0 && window.CPABuilder) { window.CPABuilder.input(c, e.target); return; }
    if (c.indexOf('dz-') === 0 && window.CPADesigner) { window.CPADesigner.input(c, e.target); return; }
    if (c === 'q') { ui.q = e.target.value; ui.limit = 150; updateArchiveList(); }
    else if (c === 'upq') { ui.upQ = e.target.value; updateUpgradeCols(); }
    else if (c === 'deckq') { ui.deckQ = e.target.value; updateDeckList(); }
    else if (c === 'draft-text') ui.draft.text = e.target.value;
    else if (c === 'draft-name') ui.draft.name = e.target.value;
    else if (c === 'restore-text') ui.restoreText = e.target.value;
    else if (c === 'cmd-q') { ui.draft.cq = e.target.value; $('#cmdlist').innerHTML = cmdListHtml(ui.draft); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target, c = t.dataset && t.dataset.c; if (!c) return;
    if (c.indexOf('bd-') === 0 && window.CPABuilder) { window.CPABuilder.change(c, t); return; }
    if (c.indexOf('dz-') === 0 && window.CPADesigner) { window.CPADesigner.change(c, t); return; }
    var d;
    switch (c) {
      case 'fdeck': ui.fdeck = t.value; ui.limit = 150; render(); break;
      case 'fset': ui.fset = t.value; ui.limit = 150; render(); break;
      case 'sort': ui.sort = t.value; render(); break;
      case 'nobasic': ui.nobasic = t.checked; ui.limit = 150; render(); break;
      case 'status':
        d = getDeck(t.dataset.id);
        if (d) {
          var st = t.value; d.status = st; d.active = st === 'active'; d.updatedAt = Date.now(); touch(d.id);
          toast(st === 'active' ? d.name + ' attivo: le sue ' + sum(d.cards) + ' carte risultano in uso.' :
            st === 'unprinted' ? d.name + ' non ancora stampato: le sue carte non entrano nell\'archivio finché non lo stampi.' :
              d.name + ' non attivo: le sue carte tornano libere.');
          render();
        } break;
      case 'deck-name': d = getDeck(); if (d && t.value.trim()) { d.name = t.value.trim(); d.updatedAt = Date.now(); touch(d.id); render(); } break;
      case 'deck-cmd': d = getDeck(); if (d) { d.commander = t.value || null; d.updatedAt = Date.now(); touch(d.id); render(); } break;
      case 'up-name':
        d = getDeck();
        var u = d && d.upgrades.filter(function (x) { return x.id === ui.upId; })[0];
        if (u && t.value.trim()) { u.name = t.value.trim(); touch(d.id); render(); } break;
      case 'cmd': ui.draft.commander = t.value || null; break;
      case 'draft-status': ui.draft.status = t.value; render(); break;
      case 'reuse': ui.draft.reuse[t.dataset.k + '|' + t.dataset.t] = t.checked; reuseSummary(); break;
      case 'draft-file':
        if (t.files && t.files[0]) {
          var f = t.files[0];
          readFile(f, function (txt) { ui.draft.text = txt; if (!ui.draft.name) ui.draft.name = f.name.replace(/\.[^.]+$/, ''); render(); });
        } break;
      case 'restore-file':
        if (t.files && t.files[0]) readFile(t.files[0], function (txt) { ui.restoreText = txt; render(); }); break;
      case 'theme': state.settings.theme = t.value; applyTheme(); touchSettings(); break;
      case 'basics': state.settings.basicsUnlimited = t.checked; touchSettings(); break;
      case 'images': state.settings.images = t.checked; touchSettings(); render(); break;
    }
  });

  /* Funzioni che la schermata di stampa (builder.js) può usare. */
  window.CPAHost = {
    cmpVersion: UPD.cmp,
    esc: esc, toast: toast, download: download, getDeck: getDeck, ui: ui, render: render, mutate: mutate,
    decks: function () { return state.decks; },
    available: function () { return !!store && store.kind !== 'claude' && typeof fetch === 'function'; }
  };

  /* ---------- Avvio ---------- */
  function boot() {
    APP.innerHTML = '<p class="sub" style="padding:40px 16px">Carico l\'archivio…</p>';
    initStore().then(function (s) {
      store = s;
      return s.load().catch(function () {
        return makeIdbStore().catch(function () { try { return makeLocalStore(); } catch (e) { return makeMemoryStore(); } })
          .then(function (s2) { store = s2; return s2.load(); });
      });
    }).then(function (data) {
      state.decks = (data.decks || []).map(C.sanitizeDeck);
      state.settings = C.sanitizeSettings(data.settings);
      archCache = null; applyTheme(); render();
    }).catch(function () { store = makeMemoryStore(); render(); });
  }
  boot();
})();

</script>
<script>
/* Coglio Proxy Builder - schermata per creare il PDF stampabile.
 * Usa il motore (pdf.js), la ricerca carte/immagini (proxy.js) e le funzioni che app.js mette in window.CPAHost. */
(function () {
  'use strict';
  var H = window.CPAHost, P = window.CPAPdf, X = window.CPAProxy, C = window.Core;
  if (!H || !P || !X) return;
  var LS = 'cpa:bd:v1';
  var esc = H.esc;
  var bd = null, resolver = null, seq = 0, runId = 0;

  /* ---------- stato e preferenze ---------- */
  function fresh() {
    return { source: 'paste', deckId: null, deckName: '', text: '', entries: [], opts: JSON.parse(JSON.stringify(P.DEFAULTS)), upBleed: '0',
      tokens: false, nobasic: false, busy: '', progress: '', page: 1, report: null, picker: null, pickList: null, presets: {}, presetName: '', msg: '' };
  }
  function prefs() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }
  function savePrefs() {
    try { localStorage.setItem(LS, JSON.stringify({ opts: bd.opts, upBleed: bd.upBleed, tokens: bd.tokens, nobasic: bd.nobasic, presets: bd.presets })); } catch (e) { /* ignorato */ }
  }
  function init() {
    if (bd) return;
    bd = fresh();
    var p = prefs();
    if (p.opts && typeof p.opts === 'object') for (var k in bd.opts) if (p.opts[k] !== undefined) bd.opts[k] = p.opts[k];
    if (p.upBleed != null) bd.upBleed = String(p.upBleed);
    bd.tokens = !!p.tokens; bd.nobasic = !!p.nobasic;
    if (p.presets && typeof p.presets === 'object') bd.presets = p.presets;
  }

  /* Le carte con un design del Designer si stampano con l'immagine disegnata (angoli quadri, 300 dpi) al posto di quella di Scryfall. */
  function attachDesigns() {
    var D = window.CPADesigner, list = bd.entries.filter(function (e) { return e.design && !e.custom; });
    if (!list.length) return Promise.resolve();
    if (!D) { list.forEach(function (e) { delete e.design; }); return Promise.resolve(); }
    var lost = 0;
    return D.ready().then(function () {
      return Promise.all(list.map(function (e) {
        return D.renderBlob(e.design, { type: 'image/jpeg', square: true, quality: 0.95 }).then(function (blob) {
          return X.fromFile(blob, P.parseJpeg).then(function (img) {

  function resolveAll() {

    H.render(); resolveAll();
  }

  /* ---------- stampe alternative ---------- */

  /* ---------- file propri ---------- */

  }

        var e = mkEntry({ name: f.name.replace(/\.[^.]+$/, ''), qty: 1 });

    });
  }

  /* ---------- generazione ---------- */
  function jobEntries() {
    var up = parseFloat(String(bd.upBleed).replace(',', '.')) || 0;
    return bd.entries.filter(inc).map(function (e) {
      var o = { name: e.name, qty: e.qty, set: e.set, cn: e.cn, card: e.card, nf: e.nf };
      if (e.custom) { e.custom.bleed = up; o.front = e.custom; }

  function prepareJob(label) {
    if (!available()) { H.toast('Il builder ha bisogno di internet per scaricare le immagini: non funziona dentro Claude.'); return Promise.reject(new Error('na')); }
    var ents = jobEntries();
    if (!ents.length) { H.toast('Non ci sono carte da stampare.'); return Promise.reject(new Error('empty')); }
    bd.busy = 'gen'; bd.report = null; bd.progress = label; softRender();
    return getResolver().prepare(ents, { parse: P.parseJpeg, tokens: bd.tokens }, function (p) {
      bd.progress = p.phase === 'cards' ? 'Cerco le carte: ' + p.found + ' / ' + p.total : 'Scarico le immagini: ' + p.done + ' / ' + p.total;
      var el = document.getElementById('bd-prog'); if (el) el.textContent = bd.progress;
    }).then(function (res) {
      ents.forEach(function (o, i) { /* ricorda le carte trovate per non cercarle di nuovo */

  function fileName(ext) {

    return base + ext;

    if (rp.substituted.length) out.push({ k: 'warn', t: plural(rp.substituted.length, 'stampa non disponibile, ne ho usata un’altra', 'stampe non disponibili, ne ho usate altre') + ': ' + rp.substituted.map(function (s) { return s.name + ' (' + s.asked + ' → ' + s.got + ')'; }).join(', ') + '.' });

    if (bd.busy) return;

      bd.progress = 'Impagino…'; var out;

      return H.download(fileName('.pdf'), out.bytes, 'application/pdf').then(function (ok) {
        var mb = (out.bytes.length / 1048576).toFixed(1).replace('.', ',');
        finish(ok === false ? 'Non sono riuscito a salvare il file.' : 'PDF creato: ' + plural(out.pages, 'pagina', 'pagine') + (out.pages !== out.totalPages ? ' (su ' + out.totalPages + ')' : '') + ', ' + mb + ' MB' + (ok === 'declined' ? ' (download annullato)' : '') + '.', describe(res));
      });
    }).catch(fail);
  }

  /* ---------- anteprima ---------- */
  /* L'anteprima esegue su un canvas le stesse operazioni di disegno che finiscono nel PDF (guide, abbondanza, angoli, intestazione),

  var thumbs = {}, pvTimer = null, zoomed = false;
  function upMm() { return parseFloat(String(bd.upBleed).replace(',', '.')) || 0; }
  function planNow() {
    var up = upMm();
    var items = bd.entries.filter(inc).map(function (e) {
      var fs = e.card ? X.faces(e.card, 'normal') : [], bord = e.card ? X.borderOf(e.card) : '#000000';
      var front, back = null;
      if (e.custom) front = { thumb: e.thumb || '', width: e.custom.width, height: e.custom.height, border: e.custom.border, cornerPatch: false, bleed: up };
      else if (e.nf) front = null;
      else front = { thumb: fs[0] ? fs[0].url : '', width: 488, height: 680, border: bord };
      if (e.customBack) back = { thumb: e.thumbBack || '', width: e.customBack.width, height: e.customBack.height, border: e.customBack.border, cornerPatch: false, bleed: up };
      else if (fs[1]) back = { thumb: fs[1].url, width: 488, height: 680, border: bord };
      return { name: e.name, qty: e.qty, set: e.set, cn: e.cn, front: front, back: back, backName: fs[1] ? fs[1].name : '' };
    });
    return P.makePlan(bd.opts, items);
  }
  function previewInner(plan) {
    if (!plan.pages.length) return '<p class="hint">Aggiungi delle carte per vedere l’anteprima.</p>';
    if (bd.page > plan.pages.length) bd.page = plan.pages.length;
    if (bd.page < 1) bd.page = 1;
    var pg = plan.pages[bd.page - 1];
    var nav = '<div class="pv-nav"><button class="btn small" data-a="bd-page" data-v="-1"' + (bd.page <= 1 ? ' disabled' : '') + '>←</button><span>Pagina ' + bd.page + ' di ' + plan.pages.length + ' · ' +
      (pg.kind === 'back' ? 'retro' : pg.kind === 'list' ? 'lista carte' : 'fronte') + '</span><button class="btn small" data-a="bd-page" data-v="1"' + (bd.page >= plan.pages.length ? ' disabled' : '') + '>→</button></div>';
    return nav + '<div class="pv-wrap' + (zoomed ? ' zoom' : '') + '" id="bd-pvbox"><canvas class="pv-canvas" id="bd-canvas" data-a="bd-zoom" role="img" aria-label="Anteprima della pagina ' + bd.page + '"></canvas></div>' +
      '<p class="hint">Anteprima con le impostazioni attuali: si aggiorna da sola. Tocca la pagina per ingrandirla.</p>';
  }
  function thumbImage(img) {
    var url = img && img.thumb; if (!url) return null;
    var t = thumbs[url];
    if (!t) {
      var im = new Image(); t = thumbs[url] = { im: im };
      im.onload = function () { schedulePreview(30); };
      im.src = url;
    }
    return t.im.complete && t.im.naturalWidth ? t.im : null;
  }
  function drawPreview() {
    var cv = document.getElementById('bd-canvas'); if (!cv || H.ui.view !== 'builder') return;
    var plan = planNow(); if (!plan.pages.length) return;
    var pg = plan.pages[Math.min(Math.max(bd.page, 1), plan.pages.length) - 1], page = P.pageOps(plan, pg);
    var box = document.getElementById('bd-pvbox'), avail = box ? box.clientWidth : 0;
    var cssW = zoomed ? Math.max(avail, 1000) : Math.min(avail || 380, 440);
    var dpr = Math.min(window.devicePixelRatio || 1, 3), wPx = Math.round(cssW * dpr);
    cv.width = wPx; cv.height = Math.round(wPx * page.heightPt / page.widthPt);
    cv.style.width = cssW + 'px'; cv.style.height = Math.round(cssW * page.heightPt / page.widthPt) + 'px';

  function after() { init(); document.body.classList.toggle('bd-lock', bd.picker != null); drawPreview(); }

  /* ---------- campi del modulo ---------- */
  function val(k) { var v = bd.opts[k]; return v == null ? '' : v; }

      else if (fs.length === 2) { st = 'doppia faccia'; cls = 'info'; }

      '<span class="bd-nm"><b>' + esc(e.name) + '</b><small>' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + (st ? '<span class="bd-st ' + cls + '">' + esc(st) + '</span>' : '') + '</small></span>' +
      '<span class="bd-acts">' +
      (e.card && !e.custom ? '<button class="btn small" data-a="bd-prints" data-id="' + e.id + '" aria-label="Scegli un’altra stampa di ' + esc(e.name) + '">Stampa…</button>' : '') +
      '<label class="btn small">' + (e.custom ? 'Cambia' : 'Tua immagine') + '<input type="file" accept="image/*" hidden data-c="bd-file" data-id="' + e.id + '" data-side="front"></label>' +

  /* Finestra per scegliere un'altra stampa: carte grandi e ben leggibili, con collezione, numero e anno. */
  function pickerHtml() {
    var e = bd.picker != null ? entryById(bd.picker) : null; if (!e) return '';
    var list = bd.pickList, body;
    if (list === 'load') body = '<p class="bd-mwait">Carico le stampe di ' + esc(e.name) + '…</p>';
    else if (!Array.isArray(list) || !list.length) body = '<p class="bd-mwait">Non ho trovato altre stampe di questa carta.</p>';
    else body = '<div class="bd-mgrid">' + list.map(function (it, i) {
      var f = X.faces(it.card, 'normal')[0], cur = e.card && e.card.id === it.card.id, yr = (it.released || '').slice(0, 4);
      return '<button class="bd-mp' + (cur ? ' on' : '') + '" data-a="bd-pick" data-id="' + e.id + '" data-n="' + i + '" aria-label="' + esc(it.setName + ' ' + it.set.toUpperCase() + ' ' + it.cn) + '">' +
        '<span class="bd-mimg"><img src="' + esc(f ? f.url : '') + '" alt="" loading="lazy">' + (cur ? '<i>In uso</i>' : '') + '</span>' +
        '<b>' + esc(it.set.toUpperCase()) + ' · ' + esc(it.cn) + '</b><small>' + esc(it.setName) + (yr ? ' · ' + esc(yr) : '') + '</small></button>';

      dz.search.msg = 'Importata: ' + (c.name || name) + '.';
      if (!art) { dz.search.busy = false; saveNow(); H.render(); return; }
      return fetchBlob(art).then(function (b) { dz.search.busy = false; return setArt(b); }, function () { dz.search.busy = false; dz.search.msg += ' Il testo è dentro, ma l’arte non si è scaricata: caricane una tua.'; saveNow(); H.render(); });
    }).catch(function (e) {
      dz.search.busy = false; dz.search.msg = e && e.status === 404 ? 'Non trovo una carta con quel nome su Scryfall.' : 'Non riesco a contattare Scryfall: controlla la connessione e riprova.'; H.render();
    });
  }

  /* ---------- legame con i mazzi ---------- */
  function keyOf(n) { return window.Core ? window.Core.keyOf(n) : String(n).toLowerCase(); }
  function addToDeck(d, deckId, qty) {
    var dk = H.getDeck(deckId); if (!dk) return;
    H.mutate(d.name + ' aggiunta a ' + dk.name + '.', function () {
      var ex = dk.cards.filter(function (c) { return c.design === d.id && keyOf(c.name) === keyOf(d.name); })[0];
      if (ex) ex.qty += qty; else dk.cards.push({ name: d.name, qty: qty, set: '', cn: '', design: d.id });
      dk.updatedAt = Date.now();
    });
  }
  function bindCard(d, deckId, cardName) {
    var dk = H.getDeck(deckId); if (!dk || !cardName) return false;
    var rows = dk.cards.filter(function (c) { return keyOf(c.name) === keyOf(cardName); });
    if (!rows.length) return false;
    H.mutate('Il design «' + d.name + '» sostituisce ' + cardName + ' in ' + dk.name + '.', function () { rows.forEach(function (r) { r.design = d.id; }); dk.updatedAt = Date.now(); });
    return true;
  }
  function unbind(deckId, cardName) {
    var dk = H.getDeck(deckId); if (!dk) return;
    H.mutate('Design tolto da ' + cardName + '.', function () { dk.cards.forEach(function (r) { if (keyOf(r.name) === keyOf(cardName)) delete r.design; }); dk.updatedAt = Date.now(); });
  }
  function dropDesign(id) {
    var ds = H.decks() || [];
    if (ds.some(function (dk) { return dk.cards.some(function (c) { return c.design === id; }); })) {
      H.mutate('Design eliminato: le carte tornano all’immagine di Scryfall.', function () { ds.forEach(function (dk) { dk.cards.forEach(function (c) { if (c.design === id) delete c.design; }); }); });
    }
    var d = byId(id);
    dz.designs = dz.designs.filter(function (x) { return x.id !== id; });
    DB.del('designs', id); if (d && d.art.id) { DB.del('art', d.art.id); delete artCache[d.art.id]; }
  }

  /* ---------- esporta / importa ---------- */
  function blobToDataUrl(b) { return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(String(r.result)); }; r.onerror = function () { res(''); }; r.readAsDataURL(b); }); }
  function dataUrlToBlob(u) {
    var m = /^data:([^;,]+);base64,(.*)$/.exec(u || ''); if (!m) return null;
    var bin = atob(m[2]), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], { type: m[1] });
  }
  function packOne(d) { return artImage(d.art.id).then(function () { return DB.get('art', d.art.id); }).then(function (b) { return (b ? blobToDataUrl(b) : Promise.resolve('')).then(function (u) { return { design: d, art: u }; }); }); }
  function exportDesigns(list, name) {
    Promise.all(list.map(packOne)).then(function (items) {
      var json = JSON.stringify({ app: 'coglio-designer', version: 1, exportedAt: new Date().toISOString(), items: items });
      return H.download(name, json, 'application/json').then(function (ok) { if (ok !== 'declined') H.toast(ok ? 'File dei design pronto (le cornici importate non sono incluse).' : 'Download non disponibile qui.'); });
    });
  }
  function importFile(file) {
    var r = new FileReader();
    r.onload = function () {
      var data; try { data = JSON.parse(String(r.result)); } catch (e) { dz.msg = 'Errore: il file non è un JSON valido.'; H.render(); return; }
      var items = data && data.app === 'coglio-designer' && Array.isArray(data.items) ? data.items : null;
      if (!items) { dz.msg = 'Errore: non è un file di design di Coglio.'; H.render(); return; }
      var chain = Promise.resolve(), n = 0;
      items.forEach(function (it) {
        chain = chain.then(function () {
          var d = norm(it.design || {}); var wasThere = byId(d.id); if (wasThere) d.id = uid('z');
          if (!/^auto:/.test(d.frameImg)) d.frameImg = '';
          d.createdAt = Date.now(); d.updatedAt = Date.now();
          var b = dataUrlToBlob(it.art), aid = '';
          var p = Promise.resolve();
          if (b) { aid = uid('a'); p = DB.put('art', b, aid); }
          d.art = { id: aid, x: +(it.design && it.design.art && it.design.art.x) || 0, y: +(it.design && it.design.art && it.design.art.y) || 0, s: +(it.design && it.design.art && it.design.art.s) || 1 };
          return p.then(function () { dz.designs.unshift(d); n++; return DB.put('designs', clone(d)); });
        });
      });
      chain.then(function () { dz.msg = n + (n === 1 ? ' design importato.' : ' design importati.'); H.render(); });
    };
    r.readAsText(file);
  }
  function download(blob, name) { return H.download(name, blob, blob.type); }
  function fname(d, ext) { return (String(d.name || 'carta').replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'carta') + ext; }

  /* ---------- eventi ---------- */
  function click(a, el) {
    var d = dz.cur, id = el.getAttribute('data-id'), k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
    switch (a) {
      case 'dz-new': create(k); break;
      case 'dz-open': var t = byId(id); if (t) editDesign(t); break;
      case 'dz-back': saveNow(); dz.view = 'list'; dz.cur = null; dz.confirm = ''; window.scrollTo(0, 0); H.render(); break;
      case 'dz-dup':
        var src = byId(id) || d; if (!src) break;
        var c = clone(src); c.id = uid('z'); c.name = src.name + ' (copia)'; c.createdAt = c.updatedAt = Date.now();
        var done = function () { dz.designs.unshift(c); saveNow().then(function () { if (dz.view === 'edit') editDesign(c); else H.render(); }); dz.cur = dz.view === 'edit' ? c : dz.cur; };
        if (src.art.id) DB.get('art', src.art.id).then(function (b) { if (!b) { c.art.id = ''; done(); return; } var nid = uid('a'); DB.put('art', b, nid).then(function () { c.art.id = nid; done(); }); }); else done();
        break;
      case 'dz-set': if (d) { d[k] = v; if (k === 'frame') { var L = R.LAYOUT[v]; if (L && !L.pt) d.pt = d.pt; } saveSoon(); H.render(); } break;
      case 'dz-col': if (d) { var cs = String(d.colors || '').toUpperCase(); d.colors = cs.indexOf(v) >= 0 ? cs.replace(v, '') : 'WUBRG'.split('').filter(function (x) { return cs.indexOf(x) >= 0 || x === v; }).join(''); saveSoon(); H.render(); } break;
      case 'dz-sym': insertSym(v); break;
      case 'dz-png': if (d) { saveNow(); renderBlob(d.id, { type: 'image/png' }).then(function (b) { return download(b, fname(d, '.png')); }).then(function (ok) { if (ok === false) H.toast('Download non disponibile qui.'); }, function () { H.toast('Non riesco a creare l’immagine.'); }); } break;
      case 'dz-jpg': if (d) { saveNow(); renderBlob(d.id, { type: 'image/jpeg', square: true }).then(function (b) { return download(b, fname(d, '.jpg')); }).then(function (ok) { if (ok === false) H.toast('Download non disponibile qui.'); }, function () { H.toast('Non riesco a creare l’immagine.'); }); } break;
      case 'dz-art-del': if (d && d.art.id) { var oid = d.art.id; d.art = { id: '', x: 0, y: 0, s: 1 }; dz.artImg = null; DB.del('art', oid); delete artCache[oid]; saveNow(); H.render(); } break;
      case 'dz-art-reset': if (d) { d.art.x = 0; d.art.y = 0; d.art.s = 1; saveSoon(); H.render(); } break;
      case 'dz-alter': if (d) alterFrom(dz.search.q || d.name); break;
      case 'dz-add': if (d && dz.bind && dz.bind.deckId) { saveNow(); addToDeck(d, dz.bind.deckId, Math.max(1, Math.min(99, parseInt(dz.bind.qty, 10) || 1))); H.render(); } break;
      case 'dz-replace': if (d && dz.bind && dz.bind.card) { saveNow(); if (bindCard(d, dz.bind.deckId, dz.bind.card)) H.render(); } break;
      case 'dz-del':
        if (!d) break;
        if (dz.confirm === 'del') { dropDesign(d.id); dz.cur = null; dz.view = 'list'; dz.confirm = ''; window.scrollTo(0, 0); H.render(); } else { dz.confirm = 'del'; H.render(); }
        break;
      case 'dz-res-del':
        dz.res.forEach(function (x) { DB.del('frames', x.id); }); dz.res = [];
        R.setResources({}); H.toast('Simboli e font importati tolti: tornano quelli disegnati. Riavvia l\u2019app per scaricare i font dalla memoria.'); H.render(); break;
      case 'dz-frame-del':
        if (d && d.frameImg) {
          var cur = d.frameImg, auto = /^auto:(.+)$/.exec(cur), gone = auto ? dz.frames.filter(function (f) { return f.group === auto[1]; }).map(function (f) { return f.id; }) : [cur];
          dz.designs.forEach(function (x) { if (x.frameImg === cur || gone.indexOf(x.frameImg) >= 0) { x.frameImg = ''; if (x !== d) DB.put('designs', clone(x)); } });
          dz.frames = dz.frames.filter(function (f) { return gone.indexOf(f.id) < 0; });
          gone.forEach(function (g) { delete dz.frameImgs[g]; DB.del('frames', g); });
          saveNow(); H.render();
        } break;
      case 'dz-export-one': if (d) { saveNow(); exportDesigns([d], fname(d, '.coglio-design.json')); } break;
      case 'dz-export-all': exportDesigns(dz.designs, 'coglio-design.json'); break;
      case 'dz-bind': openPicker(el.getAttribute('data-deck'), el.getAttribute('data-name')); break;
      case 'dz-unbind': unbind(el.getAttribute('data-deck'), el.getAttribute('data-name')); H.render(); break;
      case 'dz-pick-close': dz.picker = null; H.render(); break;
      case 'dz-keep': break;
      case 'dz-pick': if (dz.picker) { var pd = byId(id); if (pd && bindCard(pd, dz.picker.deckId, dz.picker.cardName)) { dz.picker = null; H.render(); } } break;
      case 'dz-pick-new':
        if (dz.picker) {
          var pk = dz.picker, nd = norm(R.defaults('card')); nd.id = uid('z'); nd.name = pk.cardName; nd.createdAt = nd.updatedAt = Date.now(); dz.picker = null;
          dz.designs.unshift(nd); dz.bind = { deckId: pk.deckId, card: pk.cardName, qty: 1 }; saveNow(); H.ui.view = 'designer'; editDesign(nd);
        } break;
    }
  }
  function insertSym(s) {
    var d = dz.cur; if (!d) return;
    var key = dz.focus === 'cost' ? 'cost' : dz.focus === 'flavor' ? 'flavor' : 'rules';
    var el = document.querySelector('[data-c="dz-f"][data-k="' + key + '"]');
    if (!el) return;
    var pos = typeof el.selectionStart === 'number' ? el.selectionStart : el.value.length, end = typeof el.selectionEnd === 'number' ? el.selectionEnd : pos;
    el.value = el.value.slice(0, pos) + s + el.value.slice(end); d[key] = el.value;
    try { el.focus(); el.setSelectionRange(pos + s.length, pos + s.length); } catch (e) { /* ignorato */ }
    schedulePreview(); saveSoon();
  }
  function input(c, el) {
    var d = dz.cur;
    if (c === 'dz-f' && d) { d[el.getAttribute('data-k')] = el.value; schedulePreview(); saveSoon(); if (el.getAttribute('data-k') === 'name') { var h1 = document.querySelector('.vh h1'); if (h1) h1.textContent = el.value || 'Senza nome'; } }
    else if (c === 'dz-art' && d) { d.art[el.getAttribute('data-k')] = parseFloat(el.value) || 0; schedulePreview(); saveSoon(); }
    else if (c === 'dz-q') dz.search.q = el.value;
    else if (c === 'dz-bqty' && dz.bind) dz.bind.qty = el.value;
  }
  function change(c, el) {
    var d = dz.cur;
    if (c === 'dz-f' && d) { d[el.getAttribute('data-k')] = el.value; saveSoon(); if (el.tagName === 'SELECT') H.render(); else schedulePreview(); }
    else if (c === 'dz-artfile') { if (el.files && el.files[0]) setArt(el.files[0]); }
    else if (c === 'dz-framefile') {
      var files = [].slice.call(el.files || []), last = null, p = Promise.resolve();
      files.forEach(function (f) {
        if (/\.json$/i.test(f.name) || f.type === 'application/json') { p = p.then(function () { return importPack(f).then(function (g) { if (g && g !== '*') last = { id: 'auto:' + g }; if (g) { dz.frameImgs = {}; } }); }); return; }
        p = p.then(function () {
          return blobImage(f).then(function (r) { URL.revokeObjectURL(r.url); var fr = { id: uid('f'), name: f.name.replace(/\.[^.]+$/, ''), blob: f, ink: 'dark', createdAt: Date.now() }; dz.frames.push(fr); last = fr; return DB.put('frames', fr); },
            function () { H.toast('«' + f.name + '»: non è un’immagine leggibile.'); });
        });
      });
      el.value = '';
      p.then(function () { if (last && d) { d.frameImg = last.id; saveNow(); } H.render(); });
    }
    else if (c === 'dz-frameimg' && d) { d.frameImg = el.value; saveSoon(); H.render(); }
    else if (c === 'dz-import') { if (el.files && el.files[0]) importFile(el.files[0]); }
    else if (c === 'dz-bdeck' && dz.bind) { dz.bind.deckId = el.value; dz.bind.card = ''; H.render(); }
    else if (c === 'dz-bcard' && dz.bind) { dz.bind.card = el.value; H.render(); }
  }
  function openPicker(deckId, cardName) {
    dz.picker = { deckId: deckId, cardName: cardName }; H.ui.view = 'designer'; if (dz.view !== 'list') { dz.view = 'list'; dz.cur = null; }
    load().then(function () { H.render(); }); H.render();
  }
  function escape() {
    if (dz.picker) { dz.picker = null; H.render(); return true; }
    return false;
  }
  document.addEventListener('focusin', function (e) {
    var t = e.target; if (t && t.getAttribute && t.getAttribute('data-c') === 'dz-f') dz.focus = t.getAttribute('data-k');
  });

  window.CPADesigner = {
    open: open, html: html, after: after, click: click, input: input, change: change, escape: escape, renderBlob: renderBlob,
    ready: load, get: byId, list: function () { return dz.designs.slice(); }, openPicker: openPicker, state: dz
  };
})();

</script>
